name: Daily Instagram Post 5:55 JST

on:
  schedule:
    - cron: '55 8 * * *'   # 17:55 JST = 08:55 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (投稿しない / no actual Instagram post)'
        required: false
        default: 'true'
        type: boolean

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz PyNaCl

      - name: Run daily post script
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CANVA_DESIGN_ID: DAGsRHlSvkw
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/daily_post.py
