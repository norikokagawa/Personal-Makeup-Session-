name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lists the product photos actually present, so the storefront can ask
      # once instead of probing for each product. Regenerated on every deploy,
      # so adding a photo is still just dropping in a file.
      - name: Build product photo manifest
        run: |
          cd shop/assets/img/products
          ls -1 2>/dev/null | grep -Ei '\.(jpg|jpeg|png|webp)$' | sort \
            | python3 -c 'import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))' \
            > manifest.json
          echo "photos in manifest: $(python3 -c 'import json;print(len(json.load(open("manifest.json"))))')"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
