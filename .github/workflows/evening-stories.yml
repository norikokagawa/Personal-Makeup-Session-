name: Evening stories 19:00 SGT (atelierR 夜のストーリーズ)

# 毎晩 19:00 SGT に、column-post ブランチの stories/pool/ からコスメの縦長写真を 3〜4 枚ランダムにストーリーズ投稿する。
# GitHub の定時実行は遅れることがあるので早めに起動し、19:00 まで待って公開する。
# 2回目は1回目が遅れた・落ちたときの予備 (stories/history.json で二重投稿しない)。
on:
  schedule:
    - cron: '30 10 * * *'   # 18:30 SGT
    - cron: '48 10 * * *'   # 18:48 SGT (予備)
  workflow_dispatch:
    inputs:
      now:
        description: 'すぐ投稿する (テスト用)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: column-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: column-post
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests Pillow
      - name: Publish evening stories
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          git pull -q origin column-post
          python scripts/evening_stories/stories.py publish ${{ inputs.now && '--now' || '' }}
      - name: Notify
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Evening stories failed ($(date -u +%F))" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
