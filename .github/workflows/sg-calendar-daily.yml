name: SG November calendar — daily Instagram (TEST MODE)

# 既存の daily-instagram-post.yml とは独立したワークフロー。
# 本番移行はテスト成功・明示的な承認の後。承認までは schedule を有効にしない。
#   04:00 SGT (20:00 UTC 前日)  mode=ledger : Gmail → 台帳
#   04:15 SGT                   Claude 定期実行: Canva 1・2ページの横線を更新・検証・保存
#   04:40 SGT (20:40 UTC 前日)  mode=post   : 照合 → 高画質書き出し → Metricool (05:00 SGT)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'post (照合・画像・Instagram) / ledger (Gmail 台帳) / watchdog (公開確認) / auth-check (認証確認のみ)'
        type: choice
        options: [post, ledger, watchdog, auth-check]
        default: post
      check_canva:
        description: 'auth-check で Canva も確認する (1回限りの refresh token を消費・更新して保存)'
        type: boolean
        default: false
      dry_run:
        description: 'DRY_RUN (true = 書き込みなし、Canva はテスト用コピー)'
        type: boolean
        default: true
      auto_publish:
        description: 'AUTO_PUBLISH (false = 画像保存と非公開コンテナ作成まで。公開しない)'
        type: boolean
        default: false
      ig_probe:
        description: 'DRY_RUN 中に Instagram の非公開コンテナ作成だけ試す (公開しない)'
        type: boolean
        default: false
  # テスト期間中のみ: このブランチへの push で DRY_RUN を実行する。本番移行時に削除。
  push:
    branches: [claude/loving-franklin-wr0o7p]
    paths:
      - 'scripts/sg_calendar/**'
      - 'config/sg_*'
      - 'tests/**'
      - '.github/workflows/sg-calendar-daily.yml'
  # GitHub の定時実行は遅延・欠落があるため「予備」。主経路は docs/SG_SCHEDULING.md 参照。
  # 二重に起動しても投稿状態の記録で重複しない。
  # schedule:
  #   - cron: '7 20 * * *'    # 04:07 SGT ledger (予備)
  #   - cron: '23 20 * * *'   # 04:23 SGT post   (予備)
  #   - cron: '17 21 * * *'   # 05:17 SGT watchdog

permissions:
  contents: write   # instagram-media ブランチに状態・画像・実行記録を保存 (DRY_RUN では書かない)
  issues: write     # 停止・失敗時の通知

# Canva の refresh token は1回限りなので、同時に2つ実行しない
# (既存の daily-instagram-post.yml も同じ token を使う。テスト中は同時に手動実行しないこと)
concurrency:
  group: canva-refresh-token
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # post は 05:00 まで最大50分待機する
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz PyNaCl Pillow

      - name: Unit tests
        run: python -m unittest tests/test_sg_calendar.py

      - name: Run
        id: run
        env:
          # push (テスト用ブランチ) は認証確認のみ。画像テストは一時ファイルがあるときだけ post で行う
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '7 20 * * *' && 'ledger' || (github.event.schedule == '17 21 * * *' && 'watchdog' || 'post')) || (github.event_name == 'push' && (hashFiles('tests/fixtures/test_export_urls.json') != '' && 'post' || 'auth-check')) || inputs.mode || 'post' }}
          # schedule は本番移行時に値を見直す。push / 手動の既定は DRY_RUN
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (github.event_name == 'push' && 'true' || inputs.dry_run) }}
          AUTO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.auto_publish || 'false' }}
          CHECK_CANVA: ${{ inputs.check_canva || 'false' }}
          IG_PROBE: ${{ (github.event_name == 'push' && hashFiles('tests/fixtures/test_export_urls.json') != '') && 'true' || inputs.ig_probe || 'false' }}
          TEST_EXPORT_URLS_FILE: ${{ github.event_name == 'push' && 'tests/fixtures/test_export_urls.json' || '' }}
          CANVA_STATE_FILE: ${{ github.event_name == 'push' && 'tests/fixtures/canva_state_test.json' || '' }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          METRICOOL_USER_TOKEN: ${{ secrets.METRICOOL_USER_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          SG_OUT_DIR: out
        run: |
          set +e
          python scripts/sg_calendar/run_daily.py "$MODE"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Image check summary
        if: always()
        run: |
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          for p in sorted([*Path("out").glob("*.png"), *Path("out").glob("*.jpg")]):
              with Image.open(p) as im:
                  print(f"{p.name}: {im.size[0]}x{im.size[1]} {im.format} {p.stat().st_size // 1024} KB")
          EOF

      - name: Upload report and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg-calendar-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore

      # 停止 (exit 2) と失敗 (認証切れ等) は Issue で通知 → リポジトリ所有者にメールが届く
      - name: Notify
        if: failure() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          if [ "$CODE" = "2" ]; then
            title="SG calendar: 自動停止 — 予約情報の確認が必要 ($(date -u +%F))"
          else
            title="SG calendar: 実行失敗 / 認証切れの可能性 ($(date -u +%F))"
          fi
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f out/report.json ]; then
            body="$body"$'\n\n```json\n'"$(head -c 60000 out/report.json)"$'\n```'
          fi
          gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
