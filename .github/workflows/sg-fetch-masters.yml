name: SG calendar — fetch master images (one-off)

# Canva の書き出しリンクは Claude の作業環境から取得できないため、ここで取得してブランチに保存する。
on:
  push:
    branches: [claude/loving-franklin-wr0o7p]
    paths: ['assets/sg_masters/urls.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          pip install Pillow
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          from PIL import Image
          d = Path("assets/sg_masters")
          urls = json.loads((d / "urls.json").read_text())
          for name, url in urls.items():
              if name.startswith("_"):
                  continue
              p = d / f"{name}.png"
              p.write_bytes(urllib.request.urlopen(url, timeout=60).read())
              print(name, Image.open(p).size)
          (d / "urls.json").unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/sg-fetch-masters.yml
          git add -A assets/sg_masters
          git commit -m "SG calendar: add December master images"
          git push
