name: SG calendar — fetch master images (one-off)

# Canva の書き出しリンクは Claude の作業環境から取得できないため、ここで取得してブランチに保存する。
# assets/sg_masters/urls.json を push したときだけ動き、取得後にそのファイルを削除する。
on:
  push:
    branches: [claude/loving-franklin-wr0o7p]
    paths: ['assets/sg_masters/urls.json']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download, check, and test the composer on them
        run: |
          pip install Pillow numpy
          python - <<'PY'
          import json, sys, urllib.request
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, "scripts")
          from sg_calendar import compose
          d = Path("assets/sg_masters")
          urls = json.loads((d / "urls.json").read_text())
          for name, url in urls.items():
              if name.startswith("_"):
                  continue
              p = d / f"{name}.png"
              p.write_bytes(urllib.request.urlopen(url, timeout=60).read())
              with Image.open(p) as im:
                  assert im.size == (1080, 1350), (name, im.size)
                  print(name, im.size, im.mode, p.stat().st_size // 1024, "KB")
          (d / "urls.json").unlink()
          layout = compose.load_layout()
          for pl in layout["pages"]:
              n = pl["page"]
              boxes = compose.slot_boxes(Image.open(d / f"open_p{n}.png"), Image.open(d / f"booked_p{n}.png"), pl)
              print(f"page {n}: {len(boxes)} slots found and matched to the layout")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/sg_masters
          git commit -m "Add SG calendar master images (all open / all booked)"
          git push
