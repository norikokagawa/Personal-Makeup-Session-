<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Payment Guide | Personal Makeup Session SG</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"><\/script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #fdf6f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
      padding: 36px 32px;
    }

    .logo { text-align: center; margin-bottom: 24px; }
    .logo h1 { font-size: 1rem; font-weight: 600; color: #c5766a; letter-spacing: 0.04em; }
    .logo p { font-size: 0.75rem; color: #999; margin-top: 4px; }

    h2 { font-size: 0.95rem; color: #333; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #f0e8e4; }

    .amount-badge {
      display: inline-block;
      background: #eaf5f0; color: #2d9c6e;
      border-radius: 6px; padding: 3px 10px;
      font-size: 0.8rem; font-weight: 600;
      margin-bottom: 16px;
    }

    .scan-area {
      border: 2px dashed #e0d6d0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .scan-area:hover { border-color: #c5766a; background: #fff8f6; }
    .scan-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .scan-icon { font-size: 2rem; margin-bottom: 6px; }
    .scan-text { font-size: 0.85rem; color: #888; }
    .scan-text strong { color: #c5766a; }

    #thumbWrap { display: none; margin-bottom: 12px; text-align: center; }
    #thumb { max-height: 120px; border-radius: 8px; border: 1px solid #f0e8e4; }

    #ocrStatus {
      display: none;
      font-size: 0.8rem;
      color: #c5766a;
      text-align: center;
      margin-bottom: 12px;
      padding: 8px;
      background: #fff8f6;
      border-radius: 8px;
    }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; font-weight: 500; }
    .label-hint { font-size: 0.72rem; color: #aaa; font-weight: 400; margin-left: 6px; }

    input {
      width: 100%; padding: 10px 14px;
      border: 1px solid #e0d6d0; border-radius: 8px;
      font-size: 0.9rem; color: #333; background: #fdfaf8;
      transition: border-color 0.2s; outline: none;
    }
    input:focus { border-color: #c5766a; background: #fff; }
    .first-name-wrap input { border-color: #c5766a; background: #fff8f6; }

    .badge {
      display: inline-block; font-size: 0.68rem;
      background: #f9ede9; color: #c5766a;
      border-radius: 4px; padding: 2px 6px; margin-left: 6px; vertical-align: middle;
    }

    .divider { height: 1px; background: #f0e8e4; margin: 20px 0; }

    .preview-label { font-size: 0.78rem; color: #999; margin-bottom: 8px; }
    .preview-box {
      background: #f9f2ef; border-radius: 10px; padding: 16px; margin-bottom: 20px;
      font-size: 0.84rem; color: #444; white-space: pre-wrap; line-height: 1.75;
      border-left: 3px solid #c5766a;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-whatsapp { background: #25d366; color: #fff; }
    .btn-whatsapp:hover { opacity: 0.9; }
    .whatsapp-icon { width: 20px; height: 20px; }
    .note { font-size: 0.73rem; color: #bbb; text-align: center; margin-top: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>Personal Makeup Session — Singapore</h1>
      <p>WhatsApp Payment Guide Sender</p>
    </div>

    <h2>Enter booking details</h2>
    <div class="amount-badge">Fixed: 250 SGD</div>

    <div class="scan-area">
      <input type="file" id="imgInput" accept="image/*" onchange="handleImage(event)" />
      <div class="scan-icon">📸</div>
      <div class="scan-text"><strong>Tap to scan STORES screenshot</strong><br>Customer name will be auto-filled</div>
    </div>

    <div id="thumbWrap"><img id="thumb" /></div>
    <div id="ocrStatus"></div>

    <div class="form-group">
      <label>First name used in message <span class="badge">auto</span></label>
      <div class="first-name-wrap">
        <input type="text" id="firstName" placeholder="e.g. Narissa" oninput="updatePreview()" />
      </div>
    </div>

    <div class="form-group">
      <label>WhatsApp number <span class="label-hint">with country code, no spaces</span></label>
      <input type="tel" id="phone" placeholder="e.g. 6591234567" oninput="updatePreview()" />
    </div>

    <div class="divider"></div>

    <div class="preview-label">Message preview</div>
    <div class="preview-box" id="preview"></div>

    <button class="btn btn-whatsapp" onclick="openWhatsApp()">
      <svg class="whatsapp-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Send via WhatsApp
    </button>

    <p class="note">WhatsApp will open with the message pre-filled. Please review before sending.</p>
  </div>

  <script>
    const SG_SURNAMES = new Set([
      'tan','lim','lee','ng','chan','wong','goh','ong','chua','koh',
      'teo','yeo','ho','lau','loh','sim','ang','yap','chew','chong',
      'foo','heng','leong','phua','seah','sng','soh','tay','wee',
      'yong','yuen','beh','chia','cheong','fong','guo','huang','kam',
      'khoo','kwok','lai','lam','lew','liaw','liu','low','lu','mah',
      'mok','mui','neo','pang','poh','pow','quah','quek','see','shia',
      'soon','sua','sun','sung','tang','tiong','toh','tsai','tsen',
      'tu','tye','wan','woo','wu','xu','yam','yan','yang','yee',
      'yin','yu','yue','zeng','zhang','zhao','zheng','zhou',
      'bin','binte','bte','bt'
    ]);

    const SKIP_WORDS = new Set([
      'personal','makeup','session','singapore','check','more','stores',
      'booking','payment','cancel','checkin','checkout'
    ]);

    function guessFirstName(fullName) {
      const parts = fullName.trim().split(/\s+/);
      if (parts.length === 0) return '';
      if (parts.length === 1) return parts[0];
      if (parts.length === 2 && parts[1].length === 1) return parts[0];
      if (SG_SURNAMES.has(parts[0].toLowerCase())) return parts[1];
      return parts[0];
    }

    function extractNameFromOCR(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 1);
      const namePattern = /^[A-Z][a-zA-Z'-]+(\s+[A-Z][a-zA-Z'-]*\.?){0,3}$/;
      for (const line of lines) {
        if (!namePattern.test(line)) continue;
        const firstWord = line.split(' ')[0].toLowerCase();
        if (SKIP_WORDS.has(firstWord)) continue;
        return line;
      }
      return null;
    }

    async function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const thumbWrap = document.getElementById('thumbWrap');
      const thumb = document.getElementById('thumb');
      thumb.src = URL.createObjectURL(file);
      thumbWrap.style.display = 'block';

      const status = document.getElementById('ocrStatus');
      status.style.display = 'block';
      status.textContent = '📖 Reading screenshot...';

      try {
        const result = await Tesseract.recognize(file, 'eng', {
          logger: m => {
            if (m.status === 'recognizing text') {
              status.textContent = `📖 Reading... ${Math.round(m.progress * 100)}%`;
            }
          }
        });

        const name = extractNameFromOCR(result.data.text);
        if (name) {
          const firstName = guessFirstName(name);
          document.getElementById('firstName').value = firstName;
          updatePreview();
          status.textContent = `✅ Found: ${name} → using "${firstName}"`;
        } else {
          status.textContent = '⚠️ Name not found. Please type it manually.';
        }
      } catch (e) {
        status.textContent = '⚠️ Could not read screenshot. Please type the name manually.';
      }
    }

    function buildMessage() {
      const firstName = document.getElementById('firstName').value.trim() || '[Name]';
      return `Hi ${firstName}\n\nThank you very much for booking a personal makeup session in Singapore 🇸🇬\n\nThe session fee is 250 SGD.\nTo confirm your booking, please kindly make the payment via PayNow below within 24 hours.\nAfter making the payment, please send me a screenshot of the transfer here for confirmation.\n\nYour booking will be officially confirmed once the payment is verified 😊\n\nI am looking forward to seeing you on the day.\nThank you 🕊️`;
    }

    function updatePreview() {
      document.getElementById('preview').textContent = buildMessage();
    }

    function openWhatsApp() {
      const phone = document.getElementById('phone').value.replace(/[^0-9]/g, '');
      if (!phone) { alert('Please enter the WhatsApp number.'); return; }
      const firstName = document.getElementById('firstName').value.trim();
      if (!firstName) { alert('Please enter the customer\'s first name.'); return; }
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(buildMessage())}`, '_blank');
    }

    updatePreview();
  <\/script>
</body>
</html>
