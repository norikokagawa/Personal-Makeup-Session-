<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal — atelierR</title>
<meta name="description" content="A story from the atelierR Journal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atelier.css">
</head>
<body>
<div data-header></div>
<main data-article></main>
<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/data/articles.js"></script>
<script src="assets/js/imagery.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/journal.js"></script>
<script src="assets/js/newsletter.js"></script>
<script>
(function () {
  UI.mount({ current: 'journal.html' });
  var esc = Store.esc;
  var root = document.querySelector('[data-article]');
  var a = Journal.bySlug(Store.param('a'));

  if (!a) {
    root.innerHTML = '<div class="wrap"><div class="empty">' +
      '<p class="h2 serif">Story not found</p>' +
      '<p class="lede center" style="margin:0 auto 24px">This story may have moved, ' +
      'or the link may be incomplete.</p>' +
      '<a class="btn btn-outline" href="journal.html">All stories</a></div></div>';
    return;
  }

  document.title = a.title + ' — atelierR Journal';
  var meta = document.querySelector('meta[name="description"]');
  if (meta) meta.setAttribute('content', a.excerpt);

  var others = Journal.all().filter(function (x) { return x.slug !== a.slug; }).slice(0, 3);
  var piece = Journal.renderArticle(a);

  root.innerHTML =
    '<div class="wrap"><nav class="crumb" aria-label="Breadcrumb">' +
      '<a href="index.html">Home</a><span>/</span>' +
      '<a href="journal.html">Journal</a><span>/</span>' +
      '<a href="journal.html?c=' + esc(a.category) + '">' + esc(Journal.categoryName(a.category)) + '</a>' +
      '<span>/</span><span aria-current="page">' + esc(a.title) + '</span>' +
    '</nav></div>' +

    '<article class="section" style="padding-top:8px">' +
      '<div class="wrap">' +
        '<div class="jr-article">' +
          '<p class="jr-meta mb-16">' + esc(Journal.categoryName(a.category)) + ' · ' +
            esc(Journal.formatDate(a.date)) + '</p>' +
          '<h1 class="h1 mb-16">' + esc(a.title) + '</h1>' +
          '<p class="lede mb-32">' + esc(a.excerpt) + '</p>' +
        '</div>' +

        '<div class="jr-article">' +
          '<div class="jr-hero">' + Journal.hero(a, { ratio: '400 230' }) + '</div>' +
          piece.head + piece.body +
        '</div>' +

        (piece.tail ? '<div class="jr-article">' + piece.tail + '</div>' : '') +

        '<div class="jr-article mt-48">' +
          '<div class="row row-between">' +
            '<a class="link-more" href="journal.html">All stories</a>' +
            '<a class="link-more" href="shop.html">Shop the collection</a>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</article>' +

    '<div class="wrap"><div data-newsletter-slot data-source="journal"></div></div>' +

    (others.length
      ? '<section class="section">' +
          '<div class="wrap">' +
            '<div class="section-head"><h2 class="section-title">More from the Journal</h2>' +
              '<a class="link-more" href="journal.html">View all</a></div>' +
            '<div class="jr-grid">' +
              others.map(function (x) { return Journal.card(x, { showProducts: false }); }).join('') +
            '</div>' +
          '</div>' +
        '</section>'
      : '');

  Newsletter.mount();
  Imagery.enhance();
})();
</script>
</body>
</html>
