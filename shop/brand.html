<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand — atelierR</title>
<meta name="description" content="Browse the atelierR collection by brand — SUQQU, RMK, THREE, NOEVIR, Celvoke, BROWN ÉTOILE and ADDICTION.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atelier.css">
</head>
<body>
<div data-header></div>
<main>
  <div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span>/</span><a href="shop.html">Shop</a><span>/</span>
      <span aria-current="page" data-crumb></span>
    </nav>
  </div>

  <section class="section" style="padding-top:8px">
    <div class="wrap">
      <p class="eyebrow mb-16">Selected by atelierR</p>
      <h1 class="h1 mb-16" data-title></h1>
      <p class="lede mb-32" data-intro></p>
      <nav class="filter-bar-scroll mb-32" data-brand-nav aria-label="Brands"></nav>
      <div data-listing></div>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/imagery.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/listing.js"></script>
<script>
(function () {
  UI.mount({ current: 'brand.html' });
  var id = Store.param('b') || 'suqqu';
  var brand = Store.Catalog.brand(id);

  if (!brand) {
    document.querySelector('[data-title]').textContent = 'Brand not found';
    document.querySelector('[data-intro]').innerHTML =
      'We do not carry that brand. <a class="link-under" href="shop.html">Browse everything we do carry</a>.';
    document.querySelector('[data-crumb]').textContent = 'Not found';
    return;
  }

  document.title = brand.name + ' — atelierR';
  document.querySelector('[data-crumb]').textContent = brand.name;
  document.querySelector('[data-title]').textContent = brand.name;
  document.querySelector('[data-intro]').textContent = brand.note;

  document.querySelector('[data-brand-nav]').innerHTML = Store.Catalog.brands.map(function (b) {
    return '<a class="chip" href="brand.html?b=' + b.id + '"' +
      (b.id === brand.id ? ' aria-pressed="true"' : '') + '>' + Store.esc(b.name) + '</a>';
  }).join('');

  Listing.init({ root: '[data-listing]', lockBrand: brand.id });
})();
</script>
</body>
</html>
