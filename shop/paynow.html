<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay with PayNow — atelierR</title>
<meta name="description" content="PayNow payment instructions for your atelierR order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atelier.css">
</head>
<body>
<div data-header></div>
<main>
  <div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span>/</span><span aria-current="page">PayNow Payment</span>
    </nav>
  </div>

  <section class="section" style="padding-top:8px">
    <div class="wrap">
      <div data-paynow></div>
    </div>
  </section>
</main>
<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/imagery.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/order-view.js"></script>
<script>
(function () {
  UI.mount({ current: 'paynow.html' });
  var S = Store, esc = S.esc, money = S.money, CFG = S.CFG;
  var root = document.querySelector('[data-paynow]');
  var order = S.Orders.byNumber(S.param('order')) || S.Orders.last();

  if (!order) { root.innerHTML = OrderView.notFound(); return; }

  var pn = CFG.payNow;

  root.innerHTML =
    '<h1 class="h1 mb-8">Pay with PayNow</h1>' +
    '<ol class="steps mb-32" aria-label="Checkout progress">' +
      '<li class="done">Cart</li><li class="done">Your details</li><li class="now">Pay by PayNow</li>' +
    '</ol>' +

    '<div class="notice mb-32"><strong>Order ' + esc(order.orderNumber) + ' has been created.</strong><br>' +
      'It is saved and waiting for your payment. Nothing has been charged.</div>' +

    '<div class="order-layout">' +

      '<div>' +
        '<div class="qr-box mb-24">' +
          '<p class="eyebrow">Scan to pay</p>' +
          (pn.qrImage
            ? '<img class="qr-frame" style="object-fit:contain" src="' + esc(pn.qrImage) + '" alt="PayNow QR code for atelierR">'
            : '<div class="qr-frame"><span class="ph">PayNow QR code<br>placeholder</span></div>') +
          '<p class="price">' + money(order.total) + '</p>' +

          '<div class="copyable">' +
            '<span><span class="tiny" style="display:block">PayNow UEN</span><code>' + esc(pn.uen) + '</code></span>' +
            '<button data-copy="' + esc(pn.uen) + '">Copy</button>' +
          '</div>' +
          /* This QR pays to a UEN; a mobile proxy is shown only if one is configured. */
          (pn.mobile
            ? '<div class="copyable">' +
                '<span><span class="tiny" style="display:block">PayNow mobile</span><code>' + esc(pn.mobile) + '</code></span>' +
                '<button data-copy="' + esc(pn.mobile) + '">Copy</button>' +
              '</div>'
            : '') +
          '<div class="copyable">' +
            '<span><span class="tiny" style="display:block">Payment reference</span><code>' + esc(order.orderNumber) + '</code></span>' +
            '<button data-copy="' + esc(order.orderNumber) + '">Copy</button>' +
          '</div>' +
          '<p class="tiny">Account name: ' + esc(pn.accountName) + '</p>' +
          /* The registered company name differs from the shop name, which worries
             customers mid-payment. Say so before they stop and ask. */
          '<p class="tiny" style="color:var(--muted-light)">' + esc(pn.accountName) +
            ' is the registered company behind atelierR. This is the correct account.</p>' +
        '</div>' +

        '<div class="panel mb-24">' +
          '<h2 class="section-title mb-16">How to pay</h2>' +
          '<p class="small mb-16">Please scan the QR code or transfer the total amount via PayNow. ' +
            'Please include your name or order number in the payment reference. ' +
            'Your order will be confirmed once payment has been verified.</p>' +
          '<ol class="steps-list">' +
            '<li>Open your banking app and choose PayNow.</li>' +
            '<li>Scan the QR code, or enter the UEN <strong>' + esc(pn.uen) + '</strong>.</li>' +
            '<li>Enter exactly <strong>' + money(order.total) + '</strong>.</li>' +
            '<li>Type <strong>' + esc(order.orderNumber) + '</strong> in the reference field. ' +
              'If your app limits the length, your full name is fine.</li>' +
            '<li>Complete the transfer, then take a screenshot.</li>' +
          '</ol>' +
        '</div>' +

        '<div class="notice notice-warn mb-24">' +
          '<strong>Your order is not confirmed until payment has been verified by atelierR.</strong><br>' +
          'We check PayNow manually, usually ' + esc(CFG.payNow.verificationHours) + '. ' +
          'Nothing is marked as paid automatically.' +
        '</div>' +

        '<button class="btn btn-block" data-reveal>I’ve made the payment</button>' +
        '<p class="tiny mt-16 center">Not ready yet? This page stays available — ' +
          'bookmark it, or find it again from <a class="link-under" href="order.html?order=' + encodeURIComponent(order.orderNumber) + '">your order page</a>.</p>' +

        /* Reporting the payment happens here, on the same page, rather than on a
           separate step the customer has to be sent to. */
        '<div class="mt-32" data-report hidden>' +
          '<div class="rule mb-32"></div>' +
          '<h2 class="h2 serif mb-16">Send us your payment screenshot</h2>' +
          '<p class="lede mb-24">So we can match your transfer to your order. Either option is fine — ' +
            'you only need to do one.</p>' +

          '<form class="panel mb-24" data-form>' +
            '<h3 class="section-title mb-16">Option 1 — Upload your screenshot</h3>' +
            '<div class="drop" data-drop>' +
              '<input type="file" accept="image/*" data-file aria-label="Upload payment screenshot">' +
              '<p class="section-title" style="letter-spacing:0.18em">Tap to upload</p>' +
              '<p class="small mt-8" data-drop-label>PNG or JPG of your PayNow confirmation</p>' +
            '</div>' +
            '<div data-preview></div>' +
            '<button class="btn btn-block mt-24" type="submit" data-submit disabled>Submit payment confirmation</button>' +
          '</form>' +

          '<div class="panel">' +
            '<h3 class="section-title mb-16">Option 2 — Send it on WhatsApp</h3>' +
            '<p class="small mb-16">Opens WhatsApp with your order number, name and amount already written. ' +
              'Attach the screenshot there and send.</p>' +
            '<div class="panel panel-stone mb-16"><p class="small" style="white-space:pre-line" data-wa-preview></p></div>' +
            '<a class="btn btn-outline btn-block" data-wa target="_blank" rel="noopener">Send screenshot via WhatsApp</a>' +
          '</div>' +
        '</div>' +

        '<div class="mt-32" data-thanks hidden>' +
          '<div class="notice notice-ok mb-24">' +
            '<strong>Thank you. Your payment confirmation has been received.</strong><br>' +
            'atelierR will verify your PayNow payment before confirming your order.' +
          '</div>' +
          '<div class="row">' +
            '<a class="btn" href="order.html?order=' + encodeURIComponent(order.orderNumber) + '">View my order</a>' +
            '<a class="btn btn-quiet" href="shop.html">Continue shopping</a>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<aside>' +
        OrderView.summary(order) +
        OrderView.customer(order) +
        OrderView.tracker(order) +
        '<div class="panel mt-24">' +
          '<h2 class="section-title mb-16">Common questions</h2>' +
          '<ul class="stack-8">' +
            '<li class="small"><a class="link-under" href="faq.html#payment">What should I write in the reference?</a></li>' +
            '<li class="small"><a class="link-under" href="faq.html#payment">What if I forget the screenshot?</a></li>' +
            '<li class="small"><a class="link-under" href="faq.html#returns">Can I cancel before paying?</a></li>' +
            '<li class="small"><a class="link-under" href="faq.html#delivery">How long is delivery?</a></li>' +
          '</ul>' +
        '</div>' +
      '</aside>' +
    '</div>';

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-copy]');
    if (b) {
      var text = b.getAttribute('data-copy');
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { UI.toast('Copied — ' + text); });
      } else {
        UI.toast(text);
      }
      return;
    }
    if (e.target.closest('[data-reveal]')) {
      var panel = root.querySelector('[data-report]');
      panel.hidden = false;
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  /* ---------- payment report ---------- */
  var report = root.querySelector('[data-report]');
  var thanks = root.querySelector('[data-thanks]');
  var waMsg = 'Hi atelierR, I’ve completed the PayNow payment for Order #' + order.orderNumber + '.\n' +
              'Name: ' + order.customer.firstName + ' ' + order.customer.lastName + '\n' +
              'Amount: ' + money(order.total) + '\n' +
              'Payment screenshot attached.';
  root.querySelector('[data-wa-preview]').textContent = waMsg;
  root.querySelector('[data-wa]').href = S.Orders.whatsappLink(order);

  function done() {
    report.hidden = true;
    root.querySelector('[data-reveal]').hidden = true;
    thanks.hidden = false;
    thanks.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  root.querySelector('[data-wa]').addEventListener('click', function () {
    S.Orders.submitPaymentProof(order.orderNumber, { channel: 'whatsapp', uploadedAt: new Date().toISOString() });
    setTimeout(done, 400);
  });

  var file = root.querySelector('[data-file]');
  var proof = null;
  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { UI.toast('That image is over 4MB — please use a smaller screenshot'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      proof = { name: f.name, dataUrl: reader.result, uploadedAt: new Date().toISOString() };
      root.querySelector('[data-drop]').classList.add('filled');
      root.querySelector('[data-drop-label]').textContent = f.name + ' — ready to submit';
      root.querySelector('[data-preview]').innerHTML =
        '<img class="preview-img" src="' + reader.result + '" alt="Payment screenshot preview">';
      root.querySelector('[data-submit]').disabled = false;
    };
    reader.readAsDataURL(f);
  });

  root.querySelector('[data-form]').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!proof) return;
    S.Orders.submitPaymentProof(order.orderNumber, proof);
    done();
  });

  /* Returning to this page after reporting shows the thank-you straight away. */
  if (order.paymentStatus === 'submitted' || order.statusKey === 'AWAITING_VERIFICATION') done();
})();
</script>
</body>
</html>
