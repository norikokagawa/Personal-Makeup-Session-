<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — atelierR</title>
<meta name="description" content="Product details, shade guidance and application notes from atelierR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/atelier.css">
</head>
<body>
<div data-header></div>
<main data-product></main>
<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data/products.js"></script>
<script src="assets/js/imagery.js"></script>
<script src="assets/js/backend.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  UI.mount({ current: 'product.html' });
  var S = Store, esc = S.esc, money = S.money;
  var root = document.querySelector('[data-product]');
  var p = S.Catalog.byId(S.param('id'));

  if (!p) {
    root.innerHTML = '<div class="wrap"><div class="empty">' +
      '<p class="h2 serif">Product not found</p>' +
      '<p class="lede center" style="margin:0 auto 24px">This product may have been removed or the link may be incomplete.</p>' +
      '<a class="btn btn-outline" href="shop.html">Shop All</a></div></div>';
    return;
  }

  document.title = p.brand + ' ' + p.name + ' — atelierR';
  var stock = S.Catalog.stockLabel(p);
  var sold = p.stock <= 0;
  var shades = (p.shadeInfo && p.shadeInfo.shades) || [];
  var cat = S.Catalog.category(p.category);
  var images = (p.images && p.images.length ? p.images : [p.art]);

  /* ---------- gallery ---------- */
  function gallery() {
    return '<div>' +
      '<div class="gallery-main" data-gallery-main data-photo="' + esc(p.id) + '" data-photo-index="1" ' +
          'data-photo-alt="' + esc(p.brand + ' ' + p.name) + '">' +
        Imagery.render(images[0], { label: p.brand + ' ' + p.name }) + '</div>' +
      (images.length > 1
        ? '<div class="gallery-thumbs" role="tablist" aria-label="Product images">' + images.map(function (img, i) {
            return '<button role="tab" data-thumb="' + i + '" aria-selected="' + (i === 0) + '" ' +
                   'data-photo="' + esc(p.id) + '" data-photo-index="' + (i + 1) + '" ' +
                   'aria-label="View image ' + (i + 1) + '">' + Imagery.render(img, { ratio: '400 400' }) + '</button>';
          }).join('') + '</div>'
        : '') +
    '</div>';
  }

  /* ---------- purchase panel ---------- */
  function buyPanel() {
    return '<div class="pdp-info">' +
      '<p class="card-brand mb-8"><a class="link-under" href="brand.html?b=' + S.slug(p.brand) + '">' + esc(p.brand) + '</a></p>' +
      '<h1 class="h1" style="margin-bottom:10px">' + esc(p.name) + '</h1>' +
      '<p class="lede mb-16">' + esc(p.shortDescription) + '</p>' +
      '<p class="price mb-8">' + money(p.priceSGD) + '</p>' +
      '<p class="stock ' + stock.cls + ' mb-24">' + esc(stock.text) + '</p>' +

      (shades.length ? '<div class="mb-24">' +
        '<p class="label">Shade <span data-shade-name class="muted" style="text-transform:none;letter-spacing:0">' +
          esc(shades[0].name + ' · ' + shades[0].code) + '</span></p>' +
        '<div class="shade-select" data-shade-select>' + shades.map(function (s, i) {
          return '<button class="shade-swatch" data-shade="' + esc(s.name + ' ' + s.code) + '" ' +
                 'data-shade-label="' + esc(s.name + ' · ' + s.code) + '" aria-pressed="' + (i === 0) + '">' +
                 '<i style="background:' + esc(s.hex) + '"></i>' + esc(s.code) + '</button>';
        }).join('') + '</div>' +
        '<p class="tiny mt-8">Not sure? Read the <a class="link-under" href="#shade-guide">shade guide below</a>.</p>' +
      '</div>' : '') +

      (sold
        ? '<div class="notice notice-warn mb-16"><strong>Sold out.</strong> Most core products are restocked within two to four weeks. ' +
          'See <a class="link-under" href="faq.html#products">what happens when an item is sold out</a>.</div>' +
          '<a class="btn btn-outline btn-block" href="category.html?c=' + p.category + '">See similar products</a>'
        : '<div class="row mb-16">' +
            '<div class="qty">' +
              '<button data-qty="-1" aria-label="Decrease quantity">−</button>' +
              '<input type="number" value="1" min="1" max="' + p.stock + '" data-qty-input aria-label="Quantity">' +
              '<button data-qty="1" aria-label="Increase quantity">+</button>' +
            '</div>' +
            '<button class="btn" style="flex:1;min-width:180px" data-add-to-cart>Add to Cart</button>' +
          '</div>' +
          '<p class="tiny mb-24">Payment by PayNow · ' +
            (p.priceSGD >= S.CFG.delivery.freeThreshold
              ? 'Free delivery on this item'
              : 'Delivery ' + money(S.CFG.delivery.flatRate) + ', free above ' + money(S.CFG.delivery.freeThreshold)) +
          '</p>') +

      infoBlocks() +
    '</div>';
  }

  /* ---------- the answers ----------
     Price, stock and the cart come first; the detail sits in collapsed
     sections so the page opens short and stays scannable. */
  function section(title, body, open, id) {
    return '<div class="acc-item' + (open ? ' open' : '') + '"' + (id ? ' id="' + id + '"' : '') + '>' +
      '<button class="acc-q">' + esc(title) + '<span class="sign"></span></button>' +
      '<div class="acc-a">' + body + '</div></div>';
  }

  function infoBlocks() {
    var out = '<div class="acc mt-24">';

    out += section('What it is', '<p>' + esc(p.description) + '</p>', true);

    out += section('Why atelierR selected this', '<p>' + esc(p.whySelected) + '</p>', false);

    var suits = '';
    if (p.bestFor && p.bestFor.length) {
      suits += '<div class="pill-list mb-16">' +
        p.bestFor.map(function (b) { return '<span class="pill">' + esc(b) + '</span>'; }).join('') + '</div>';
    }
    if (p.finish && p.finish !== '—') {
      suits += '<p><strong style="font-weight:400">Finish:</strong> ' + esc(p.finish) +
               ' — ' + esc(finishNote(p.finish)) + '</p>';
    }
    if (suits) out += section('Who it suits, and the finish', suits, false);

    if (p.setContents && p.setContents.length) {
      out += section('What is included',
        '<ul class="stack-8">' + S.Catalog.byIds(p.setContents).map(function (c) {
          return '<li><a class="link-under" href="product.html?id=' + c.id + '">' +
                 esc(c.brand + ' ' + c.name) + '</a> <span class="small">· ' + money(c.priceSGD) + '</span></li>';
        }).join('') + '</ul>' +
        '<p class="small mt-8">Bought separately: ' +
          money(S.Catalog.byIds(p.setContents).reduce(function (n, c) { return n + c.priceSGD; }, 0)) + '</p>',
        false);
    }

    if (p.howToUse && p.howToUse.length) {
      out += section('How to use',
        '<ol class="steps-list">' + p.howToUse.map(function (s) {
          return '<li>' + esc(s) + '</li>';
        }).join('') + '</ol>', false);
    }

    if (p.shadeInfo && (p.shadeInfo.guide || shades.length)) {
      out += section('Shade guide',
        (p.shadeInfo.guide ? '<p class="mb-16">' + esc(p.shadeInfo.guide) + '</p>' : '') +
        shades.map(function (s) {
          return '<div class="shade-row"><span class="shade-dot" style="background:' + esc(s.hex) + '"></span>' +
            '<span><strong style="font-weight:400">' + esc(s.name) + ' · ' + esc(s.code) + '</strong>' +
            '<span class="small" style="display:block">' + esc(s.note) + '</span></span></div>';
        }).join('') +
        '<p class="small mt-16">More on choosing shades in the ' +
          '<a class="link-under" href="faq.html#shades">FAQ</a>.</p>',
        shades.length > 0, 'shade-guide');
    }

    return out + '</div>';
  }

  function finishNote(f) {
    return ({
      'Natural': 'looks like skin, neither matte nor shiny',
      'Satin': 'a soft, low sheen — the most wearable for most people',
      'Matte': 'no shine, longest wear, best for evening',
      'Sheer': 'translucent colour that lets your own tone show through',
      'Luminous': 'reflects light softly, for a fresh or dewy look'
    })[f] || 'see the description above';
  }

  /* ---------- help / pairings ---------- */
  function helpSection() {
    var related = S.Catalog.byIds(p.related).slice(0, 4);

    return '<section class="section bg-paper">' +
      '<div class="wrap">' +
        (related.length ? '<div class="section-head"><h2 class="section-title">Pair it with</h2></div>' +
          '<div class="product-grid mb-48">' + UI.grid(related) + '</div>' : '') +

        '<div class="split" style="border:1px solid var(--line)">' +
          '<div class="split-body">' +
            '<p class="eyebrow">Need help choosing?</p>' +
            '<p class="h3 serif">Most questions are already answered.</p>' +
            '<p class="small">Work down this list — it is faster than waiting for a reply, and it is available at any hour.</p>' +
          '</div>' +
          '<div class="split-body" style="padding:0;background:transparent">' +
            '<div class="help-links">' +
              '<a href="#shade-guide" data-open-shade><span><strong style="font-weight:400">1 · Shade guide for this product</strong>' +
                '<span class="small" style="display:block">Which shade suits you, on this page</span></span></a>' +
              '<a href="faq.html#shades"><span><strong style="font-weight:400">2 · FAQ</strong>' +
                '<span class="small" style="display:block">Shade selection, payment, delivery and returns</span></span></a>' +
              '<a href="contact.html"><span><strong style="font-weight:400">3 · Still need help? Contact atelierR</strong>' +
                '<span class="small" style="display:block">If the two above did not answer it</span></span></a>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</section>';
  }

  /* ---------- render ---------- */
  root.innerHTML =
    '<div class="wrap"><nav class="crumb" aria-label="Breadcrumb">' +
      '<a href="index.html">Home</a><span>/</span>' +
      '<a href="shop.html">Shop All</a><span>/</span>' +
      '<a href="category.html?c=' + p.category + '">' + esc(cat ? cat.name : p.category) + '</a><span>/</span>' +
      '<span aria-current="page">' + esc(p.name) + '</span>' +
    '</nav></div>' +
    '<section class="section" style="padding-top:8px"><div class="wrap"><div class="pdp">' +
      gallery() + buyPanel() +
    '</div></div></section>' +
    helpSection();

  Imagery.enhance(root);
  UI.accordion(root);

  root.addEventListener('click', function (e) {
    if (!e.target.closest('[data-open-shade]')) return;
    var sec = root.querySelector('#shade-guide');
    if (!sec) return;
    sec.classList.add('open');
    sec.querySelector('.acc-q').setAttribute('aria-expanded', 'true');
    sec.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  /* ---------- behaviour ---------- */
  var chosenShade = shades.length ? shades[0].name + ' ' + shades[0].code : '';

  root.addEventListener('click', function (e) {
    var thumb = e.target.closest('[data-thumb]');
    if (thumb) {
      var i = +thumb.getAttribute('data-thumb');
      var main = root.querySelector('[data-gallery-main]');
      main.innerHTML = Imagery.render(images[i], { label: p.name });
      main.setAttribute('data-photo-index', i + 1);
      main._photoDone = false;
      Imagery.enhance(root);
      root.querySelectorAll('[data-thumb]').forEach(function (b) {
        b.setAttribute('aria-selected', b === thumb ? 'true' : 'false');
      });
      return;
    }

    var sw = e.target.closest('[data-shade]');
    if (sw) {
      chosenShade = sw.getAttribute('data-shade');
      root.querySelectorAll('[data-shade]').forEach(function (b) {
        b.setAttribute('aria-pressed', b === sw ? 'true' : 'false');
      });
      root.querySelector('[data-shade-name]').textContent = sw.getAttribute('data-shade-label');
      return;
    }

    var q = e.target.closest('[data-qty]');
    if (q) {
      var input = root.querySelector('[data-qty-input]');
      var next = (parseInt(input.value, 10) || 1) + parseInt(q.getAttribute('data-qty'), 10);
      input.value = Math.max(1, Math.min(p.stock, next));
      return;
    }

    if (e.target.closest('[data-add-to-cart]')) {
      var qty = parseInt(root.querySelector('[data-qty-input]').value, 10) || 1;
      if (S.Cart.add(p.id, qty, chosenShade)) {
        UI.toast('Added — ' + p.name, '<a href="cart.html">View cart</a>');
      }
    }
  });
})();
</script>
</body>
</html>
